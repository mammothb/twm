# Configuration for prek (Rust-native pre-commit, https://prek.j178.dev)
#:schema https://www.schemastore.org/prek.json

# General-purpose checks (Rust-native, zero-deps, instant)
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = ["--fix=no"] },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "csharpier",
    name = "csharpier",
    language = "system",
    entry = "dotnet",
    args = ["csharpier", "format", "."],
    files = "\\.cs$",
    pass_filenames = false,
  },
  {
    id = "roslynator",
    name = "roslynator analyze",
    language = "system",
    entry = "dotnet",
    args = ["roslynator", "analyze", "Twm.slnx", "--severity-level", "warning", "--ignore-compiler-diagnostics"],
    files = "\\.cs$",
    pass_filenames = false,
  },
]
